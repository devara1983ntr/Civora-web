version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: civora-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: civora
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - civora-network

  backend:
    build: .
    container_name: civora-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/civora?authSource=admin
      JWT_SECRET: your-production-jwt-secret-key
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    networks:
      - civora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment and configure when frontend is ready
  # frontend:
  #   build: ../
  #   container_name: civora-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - civora-network

volumes:
  mongodb_data:

networks:
  civora-network:
    driver: bridge